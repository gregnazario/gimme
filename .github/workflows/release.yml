name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i '' "s/2.0.0-dev/$VERSION/" Sources/GimmeCore/Version.swift
          echo "Set version to $VERSION"

      - name: Build release (CLI)
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Verify binary
        run: |
          .build/release/gimme --version
          test -s .build/release/gimme

      - name: Strip + tarball CLI
        run: |
          strip .build/release/gimme
          tar czf gimme-darwin-arm64.tar.gz -C .build/release gimme

      - name: Build app bundle (best-effort)
        id: app
        continue-on-error: true
        run: |
          sed -i '' "s/0.1.0/${{ steps.version.outputs.version }}/" app/Info.plist
          sh app/build-app.sh
          tar czf Gimme-darwin-arm64.tar.gz -C app Gimme.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: gimmie ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            gimme-darwin-arm64.tar.gz
            Gimme-darwin-arm64.tar.gz
