[package]
name = "fd"
desc = "A simple, fast and user-friendly alternative to find"
homepage = "https://github.com/sharkdp/fd"
license = "MIT OR Apache-2.0"

[[version]]
ver = "10.4.2"

[[version.asset]]
os = "macos"
arch = "arm64"
url = "https://github.com/sharkdp/fd/releases/download/v10.4.2/fd-v10.4.2-aarch64-apple-darwin.tar.gz"
sha256 = "623dc0afc81b92e4d4606b380d7bc91916ba7b97814263e554d50923a39e480a"

[install]
strategy = "steps"

[[install.step]]
extract = "${asset}"

[[install.step]]
copy = { from = "fd-v10.4.2-aarch64-apple-darwin/fd", to = "${prefix}/bin/fd" }

[[provides]]
bin = ["fd"]

[livecheck]
strategy = "github-release"
repo = "sharkdp/fd"
regex = 'v?(\d+\.\d+\.\d+)'
