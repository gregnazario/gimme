[package]
name = "ripgrep"
desc = "Recursively search directories for a regex pattern"
homepage = "https://github.com/BurntSushi/ripgrep"
license = "Unlicense OR MIT"

[[version]]
ver = "15.2.0"

[[version.asset]]
os = "macos"
arch = "arm64"
url = "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-aarch64-apple-darwin.tar.gz"
sha256 = "3750b2e93f37e0c692657da574d7019a101c0084da05a790c83fd335bad973e4"

[install]
strategy = "steps"

[[install.step]]
extract = "${asset}"

[[install.step]]
copy = { from = "ripgrep-15.2.0-aarch64-apple-darwin/rg", to = "${prefix}/bin/rg" }

[[provides]]
bin = ["rg"]

[livecheck]
strategy = "github-release"
repo = "BurntSushi/ripgrep"
regex = '(\d+\.\d+\.\d+)'
