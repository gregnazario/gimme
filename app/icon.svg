<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: deep purple to indigo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#673ab7"/>
      <stop offset="100%" stop-color="#3f51b5"/>
    </linearGradient>
    <!-- Inner glow -->
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#9575cd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3f51b5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle background (rounded rect approximating macOS icon shape) -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#glow)"/>

  <!-- The package/install concept: a downward arrow entering an open box -->
  <g transform="translate(512, 512)">
    <!-- Open box (trapezoid) -->
    <path d="M -180 60 L 0 160 L 180 60 L 180 -60 L 0 -160 L -180 -60 Z"
          fill="none" stroke="white" stroke-width="48" stroke-linejoin="round"
          opacity="0.85"/>
    <!-- Box front face -->
    <path d="M -180 60 L 0 160 L 180 60 L 0 -30 Z"
          fill="white" opacity="0.12"/>
    <!-- Arrow pointing down into the box -->
    <path d="M 0 -280 L 0 -20 M -110 -130 L 0 -20 L 110 -130"
          fill="none" stroke="white" stroke-width="48"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Small accent dot on the arrow -->
    <circle cx="0" cy="-300" r="18" fill="white" opacity="0.6"/>
  </g>

  <!-- Subtle "g" letterform in bottom right (brand mark) -->
  <text x="820" y="880" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif"
        font-size="180" font-weight="700" fill="white" opacity="0.12"
        text-anchor="middle">g</text>
</svg>
